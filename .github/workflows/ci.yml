name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check Markdown links (relative only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate
        run: |
          for dir in . bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  terraform-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # HIGH 以下は一覧として出すだけで、CRITICAL があれば失敗させる
      - name: Report HIGH and above
        run: >-
          docker run --rm -v "$PWD/infra:/src" -w /src aquasec/trivy:0.58.2
          config --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 0 .
      - name: Fail on CRITICAL
        run: >-
          docker run --rm -v "$PWD/infra:/src" -w /src aquasec/trivy:0.58.2
          config --severity CRITICAL --ignorefile .trivyignore --exit-code 1 .

  # AWS 側の準備（infra/bootstrap）が済み、リポジトリ変数が設定されたときだけ動く
  terraform-plan:
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=dev/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      # 読み取り専用ロールなので state のロックは取らない
      - run: terraform plan -input=false -lock=false -no-color
