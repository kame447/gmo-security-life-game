<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="日常の選択を通じて情報セキュリティを学ぶ人生シミュレーションゲーム（制作中）。">
  <title>セキュリティ人生シミュレーション | 制作中</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f8; color: #17232a; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
    article { max-width: 38rem; width: 100%; }
    .eyebrow { font-size: .8rem; color: #4a626e; letter-spacing: .12em; font-weight: 650; }
    h1 { font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.35; letter-spacing: -.03em; margin: 1.15rem 0; }
    p { color: #485a63; font-size: 1rem; line-height: 1.85; margin: 0 0 1.5rem; }
    .status { display: inline-flex; align-items: center; gap: .65rem; border-top: 1px solid #d7dfe2; padding-top: 1.15rem; font-size: .9rem; }
    .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #507c79; }
    footer { color: #71818a; font-size: .76rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <main>
    <article>
      <div class="eyebrow">LIFE × SECURITY</div>
      <h1>セキュリティ人生<br>シミュレーション</h1>
      <p>日常生活の選択を通じて、身近な情報セキュリティのリスクと、その影響・対処を考えるゲームを制作しています。</p>
      <div class="status"><span class="dot" aria-hidden="true"></span><span>制作中 — 体験版はまだ公開していません</span></div>
      <footer>このページは公開環境の接続確認用です。</footer>
    </article>
  </main>
</body>
</html>
