<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>適用済みサンプル | セキュリティ人生シミュレーション</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #1e3734; color: #fff; font: 14px/1.5 "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
      header { padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 3px 0; color: #d0e3d5; font-size: 12px; }
      a, button { color: #1e493d; background: #f3f8f0; border: 0; border-radius: 6px; padding: 9px 12px; font: inherit; font-weight: bold; text-decoration: none; cursor: pointer; }
      #stage { position: relative; height: calc(100vh - 108px); min-height: 260px; background: #1b1922; overflow: hidden; }
      #view { display: block; outline-offset: -4px; }
      #dialog { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(600px, calc(100% - 32px)); padding: 14px; border: 2px solid #f4ecdc; border-radius: 8px; background: #242a31ee; }
      #dialog strong { color: #ffe08a; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <div><h1>適用済みサンプルでゲームを確認</h1><p>矢印 / WASD：移動　Shift：走る　Z / Space / Enter：調べる</p><p>適用後のファイルを読み込みます。画面の未書き出し変更は含みません。</p></div>
      <div><button id="reset" type="button">最初から</button> <a href="./editor.html">エディタへ戻る</a></div>
    </header>
    <main id="stage"><canvas id="view" tabindex="0" aria-label="サンプルゲーム画面"></canvas><div id="dialog" role="status" hidden><strong id="speaker"></strong><p id="dialog-text"></p></div></main>
    <script type="module" src="/src/editor-ui/preview.ts"></script>
  </body>
</html>
